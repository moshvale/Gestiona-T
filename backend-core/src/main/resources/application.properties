# ============================================
# SEGURIDAD - ALTA DE ANALISTAS
# ============================================
# Path secreto para acceder al portal de administración
# ¡CAMBIAR EN PRODUCCIÓN! Debe ser una cadena aleatoria larga
admin.portal.secret-path=${ADMIN_PORTAL_SECRET_PATH:gestiona-t-admin-portal-2026-ine-secreto}

# Política de password para analistas
admin.analista.password.min-length=12
admin.analista.password.require-uppercase=true
admin.analista.password.require-number=true
admin.analista.password.require-special=true

# Rate limiting para alta de analistas (intentos por hora por IP)
admin.analista.rate-limit.max-attempts=5
admin.analista.rate-limit.window-hours=1

# ============================================
# ✅ NUEVO: CONFIGURACIÓN DE EXPEDIENTES LABORALES
# ============================================
# Configuración del módulo de expedientes laborales del personal en activo
# Tamaño máximo de archivos de expediente (en bytes, 10MB por defecto)
expediente.documento.max-size-bytes=10485760

# Tipos de archivo permitidos para documentos de expediente
expediente.documento.allowed-types=application/pdf,image/jpeg,image/png

# Configuración de roles para expedientes laborales
# Los analistas principales son responsables de dar de alta al personal en el Sistema de Nómina
expediente.roles.analista-principal=ROLE_ANALISTA_PRINCIPAL
expediente.roles.responsable-jle=ROLE_RESPONSABLE_JLE

# Validación de número de empleado (solo dígitos, longitud máxima 20)
expediente.numero-empleado.pattern=^[0-9]{1,20}$

# ============================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# ============================================
# Para desarrollo: 'validate' verifica que el esquema coincida con las entidades
# Para producción: 'none' y usar scripts SQL manuales (migraciones)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# CONFIGURACIÓN DE MULTIPART (CARGA DE ARCHIVOS)
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ============================================
# CONFIGURACIÓN DE LOGGING
# ============================================
logging.level.mx.ine.gestiona_t=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN